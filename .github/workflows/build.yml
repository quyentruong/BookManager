name: Build Windows and Linux

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build:
        name: Build (${{ matrix.platform }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows
                      os: windows-latest
                      build_script: electron:build:win
                      artifact_name: BookManager-windows
                      artifact_paths: |
                          dist-electron/BookManager.exe
                          dist-electron/BookManager-win.zip
                    - platform: linux
                      os: ubuntu-latest
                      build_script: electron:build:linux
                      artifact_name: BookManager-linux
                      artifact_paths: |
                          dist-electron/*.AppImage

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build application
              env:
                  APPIMAGE_EXTRACT_AND_RUN: '1'
              run: npm run ${{ matrix.build_script }} -- --publish never

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_paths }}
                  if-no-files-found: error

    release:
        name: Publish GitHub Release
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release-assets/BookManager.exe
                      release-assets/BookManager-win.zip
                      release-assets/*.AppImage
                  generate_release_notes: true
