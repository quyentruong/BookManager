name: Build Windows and Linux

on:
    workflow_dispatch:
        inputs:
            platform:
                description: Platform to build
                required: true
                default: all
                type: choice
                options:
                    - all
                    - windows
                    - linux
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-windows:
        name: Build (Windows)
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Windows application
              run: npm run electron:build:win -- --publish never

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: BookManager-windows
                  path: |
                      dist-electron/BookManager.exe
                      dist-electron/BookManager-win.zip
                  if-no-files-found: error

    build-linux:
        name: Build (Linux)
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              env:
                  ONNXRUNTIME_NODE_INSTALL: 'skip'
              run: npm ci

            - name: Build Linux application
              env:
                  APPIMAGE_EXTRACT_AND_RUN: '1'
              run: npm run electron:build:linux -- --publish never

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: BookManager-linux
                  path: dist-electron/*.AppImage
                  if-no-files-found: error

    release:
        name: Publish GitHub Release
        needs:
            - build-windows
            - build-linux
        if: startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release-assets/BookManager.exe
                      release-assets/BookManager-win.zip
                      release-assets/*.AppImage
                  generate_release_notes: true
